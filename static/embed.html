<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Demo Studio — Chat</title>
  <link rel="stylesheet" href="/static/styles.css?v=3" />
  <script src="/static/tableau.extensions.1.latest.min.js"></script>
  <script>
    document.documentElement.classList.add("embed");
    if (!location.hash) history.replaceState(null, "", location.pathname + "#chat");
    window.addEventListener("DOMContentLoaded", () => {
      if (window.tableau && tableau.extensions && tableau.extensions.initializeAsync) {
        tableau.extensions.initializeAsync().catch((e) => console.warn("Tableau ext init:", e));
      }
    });
  </script>
</head>
<body>
  <main>
    <section class="card" id="chat-card">
      <div class="card-head">
        <h2>Demo Studio</h2>
        <div class="card-head-actions">
          <label class="toggle">
            <span class="toggle-label">Autorun</span>
            <input type="checkbox" id="autorun" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
          <label class="toggle">
            <span class="toggle-label">Show code</span>
            <input type="checkbox" id="show-code" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
          <select id="model-select">
            <option value="us.anthropic.claude-sonnet-4-5-20250929-v1:0">Sonnet 4.5</option>
            <option value="us.anthropic.claude-opus-4-6-v1">Opus 4.6</option>
          </select>
          <button id="apply-top" class="primary hidden">Apply</button>
          <button id="discard-top" class="hidden">Discard</button>
        </div>
      </div>
      <textarea id="message" rows="3" placeholder="Describe a change to the data or schema…"></textarea>
      <span id="embed-context" class="muted"></span>
      <div class="actions">
        <button id="send" class="primary">Plan change</button>
        <button id="rollback" class="mini">Rollback last change</button>
        <span id="status" class="status"></span>
      </div>

      <div id="plan" class="hidden">
        <h3>Proposed change</h3>
        <div class="plan-summary" id="plan-summary"></div>
        <div class="plan-meta"><span class="tag" id="plan-lang"></span><span id="plan-notes" class="muted"></span></div>
        <pre id="plan-code"></pre>
      </div>
    </section>
  </main>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
